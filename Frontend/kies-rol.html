<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kies dashboard – RaceCoachFinder</title>
        <link rel="icon" type="image/png" href="favicon.png">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .kies-kaart {
            max-width: 480px; margin: 5rem auto;
            background: var(--kleur-wit); border-radius: var(--rand);
            box-shadow: var(--schaduw); padding: 2.5rem;
            text-align: center;
        }
        .kies-kaart h2 { font-size: 1.5rem; font-weight: 800; margin-bottom: 0.4rem; }
        .kies-kaart p { color: var(--kleur-subtekst); font-size: 0.9rem; margin-bottom: 2rem; }
        .rol-keuze { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
        .rol-optie {
            border: 2px solid #e0e0e0; border-radius: var(--rand);
            padding: 1.75rem 1rem; text-align: center; cursor: pointer;
            text-decoration: none; color: inherit;
            transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
            display: block;
        }
        .rol-optie:hover {
            border-color: var(--kleur-primair); background: #f9f9f0;
            box-shadow: 0 4px 16px rgba(0,0,0,0.08);
        }
        .rol-icoon { font-size: 2.5rem; margin-bottom: 0.6rem; }
        .rol-naam { font-weight: 700; font-size: 1.05rem; }
        .rol-sub { font-size: 0.8rem; color: var(--kleur-subtekst); margin-top: 0.2rem; }
    </style>
</head>
<body>

<nav>
    <span class="nav-logo">Race<span>Coach</span>Finder</span>
</nav>

<div class="container">
    <div class="kies-kaart">
        <h2 id="welkom-naam">Welkom terug!</h2>
        <p>Je hebt zowel een coach- als rijdersprofiel. Waar wil je naartoe?</p>
        <div class="rol-keuze">
            <a class="rol-optie" href="dashboard-coach.html">
                <div class="rol-icoon">🏁</div>
                <div class="rol-naam">Coach dashboard</div>
                <div class="rol-sub">Boekingen &amp; profiel beheren</div>
            </a>
            <a class="rol-optie" href="dashboard-rijder.html">
                <div class="rol-icoon">🏎️</div>
                <div class="rol-naam">Rijder dashboard</div>
                <div class="rol-sub">Coaches zoeken &amp; boeken</div>
            </a>
        </div>
    </div>
</div>

<footer>
    <div class="footer-inhoud">
        <div class="footer-links">
            <a href="contact.html">Contact</a>
            <a href="disclaimer.html">Disclaimer</a>
        </div>
        <p>&copy; 2026 RaceCoachFinder</p>
    </div>
</footer>

<script src="js/auth.js"></script>
<script>
const g = getGebruiker();
if (!g) location.href = 'inloggen.html';
if (g) document.getElementById('welkom-naam').textContent = 'Welkom terug, ' + g.naam + '!';
</script>
</body>
</html>
