<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account inrichten – RaceCoachFinder</title>
        <link rel="icon" type="image/png" href="favicon.png">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .inrichten-kaart {
            max-width: 460px;
            margin: 4rem auto;
            background: var(--kleur-wit);
            border-radius: var(--rand);
            box-shadow: var(--schaduw);
            padding: 2.25rem 2.5rem 2rem;
        }
        .welkom-badge {
            display: inline-block;
            background: #e8f5e9;
            color: #2e7d32;
            font-size: 0.8rem;
            font-weight: 700;
            padding: 0.25rem 0.75rem;
            border-radius: 20px;
            margin-bottom: 1rem;
        }
        .inrichten-kaart h2 { font-size: 1.4rem; font-weight: 800; margin-bottom: 0.4rem; }
        .inrichten-kaart p.subtitel { color: var(--kleur-subtekst); font-size: 0.9rem; margin-bottom: 1.75rem; }

        .stap-blok {
            display: flex;
            gap: 0.75rem;
            margin-bottom: 1.5rem;
        }
        .stap-nummer {
            width: 28px; height: 28px; border-radius: 50%;
            background: var(--kleur-primair); color: #fff;
            font-size: 0.8rem; font-weight: 700;
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0; margin-top: 0.15rem;
        }
        .stap-blok-inhoud { flex: 1; }
        .stap-blok-inhoud label { font-weight: 600; font-size: 0.88rem; display: block; margin-bottom: 0.4rem; }
    </style>
</head>
<body>

<nav>
    <span class="nav-logo">Race<span>Coach</span>Finder</span>
</nav>

<div class="container">
    <div class="inrichten-kaart">
        <div class="welkom-badge">Welkom bij RaceCoachFinder!</div>
        <h2>Richt je account in</h2>
        <p class="subtitel">Stel je eigen e-mailadres en wachtwoord in om verder te gaan.</p>

        <div id="melding"></div>

        <div class="stap-blok">
            <div class="stap-nummer">1</div>
            <div class="stap-blok-inhoud">
                <label for="email">Jouw e-mailadres</label>
                <input type="email" id="email" placeholder="jouw@email.com" style="width:100%">
            </div>
        </div>

        <div class="stap-blok">
            <div class="stap-nummer">2</div>
            <div class="stap-blok-inhoud">
                <label for="wachtwoord">Nieuw wachtwoord</label>
                <input type="password" id="wachtwoord" placeholder="Minimaal 4 tekens" style="width:100%">
            </div>
        </div>

        <div class="stap-blok">
            <div class="stap-nummer">3</div>
            <div class="stap-blok-inhoud">
                <label for="wachtwoord-herhaal">Wachtwoord herhalen</label>
                <input type="password" id="wachtwoord-herhaal" placeholder="Zelfde wachtwoord" style="width:100%">
            </div>
        </div>

        <button class="btn btn-primair" style="width:100%;margin-top:0.5rem" onclick="richtIn()">
            Account inrichten
        </button>
    </div>
</div>

<footer>
    <div class="footer-inhoud">
        <div class="footer-links">
            <a href="hoe-werkt-het.html">Hoe werkt het</a>
            <a href="contact.html">Contact</a>
            <a href="privacybeleid.html">Privacybeleid</a>
            <a href="algemene-voorwaarden.html">Voorwaarden</a>
            <a href="disclaimer.html">Disclaimer</a>
        </div>
        <p>&copy; 2026 RaceCoachFinder</p>
    </div>
</footer>

<script src="js/auth.js"></script>
<script>
const gebruiker = getGebruiker();
if (!gebruiker) location.href = 'inloggen.html';
if (gebruiker && gebruiker.heeftAccountIngericht !== false) location.href = 'dashboard-coach.html';

async function richtIn() {
    const email = document.getElementById('email').value.trim();
    const wachtwoord = document.getElementById('wachtwoord').value;
    const herhaal = document.getElementById('wachtwoord-herhaal').value;

    if (!email)                     { toonMelding('Vul je e-mailadres in.', 'fout'); return; }
    if (wachtwoord.length < 4)      { toonMelding('Wachtwoord moet minimaal 4 tekens zijn.', 'fout'); return; }
    if (wachtwoord !== herhaal)     { toonMelding('Wachtwoorden komen niet overeen.', 'fout'); return; }

    try {
        const data = await authVerzoek('/auth/richt-account-in', 'POST', {
            nieuwEmail: email,
            nieuwWachtwoord: wachtwoord
        });

        localStorage.setItem('kcf_token', data.token);
        localStorage.setItem('kcf_gebruiker', JSON.stringify({
            id: data.id, naam: data.naam, email: data.email,
            rol: data.rol, heeftAccountIngericht: true
        }));

        toonMelding('Gelukt! Je wordt doorgestuurd...', 'succes');
        setTimeout(() => location.href = 'dashboard-coach.html', 1200);
    } catch (e) {
        toonMelding(e.message, 'fout');
    }
}

function toonMelding(tekst, type) {
    const klasse = type === 'succes' ? 'melding-succes' : 'melding-fout';
    document.getElementById('melding').innerHTML = '<div class="melding ' + klasse + '">' + tekst + '</div>';
}
</script>
</body>
</html>
