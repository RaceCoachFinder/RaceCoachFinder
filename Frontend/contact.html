<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact – RaceCoachFinder</title>
        <link rel="icon" type="image/png" href="favicon.png">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .contact-wrap {
            display: grid; grid-template-columns: 1fr 1.6fr; gap: 2rem;
            max-width: 860px; margin: 3rem auto; align-items: start;
        }
        @media (max-width: 680px) { .contact-wrap { grid-template-columns: 1fr; } }

        .contact-info { background: var(--kleur-wit); border-radius: var(--rand); box-shadow: var(--schaduw); padding: 2rem; }
        .contact-info h2 { font-size: 1.3rem; font-weight: 800; margin-bottom: 0.5rem; }
        .contact-info p { color: var(--kleur-subtekst); font-size: 0.9rem; line-height: 1.6; }
        .contact-detail { margin-top: 1.5rem; display: flex; flex-direction: column; gap: 0.9rem; }
        .contact-item { display: flex; align-items: flex-start; gap: 0.75rem; }
        .contact-icoon { font-size: 1.1rem; margin-top: 0.1rem; flex-shrink: 0; }
        .contact-item-label { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.5px; color: var(--kleur-subtekst); font-weight: 600; }
        .contact-item-waarde { font-size: 0.92rem; font-weight: 600; }
        .contact-item-waarde a { color: var(--kleur-tekst); }
        .contact-item-waarde a:hover { color: var(--kleur-primair); text-decoration: none; }

        .contact-form-kaart { background: var(--kleur-wit); border-radius: var(--rand); box-shadow: var(--schaduw); padding: 2rem; }
        .contact-form-kaart h2 { font-size: 1.3rem; font-weight: 800; margin-bottom: 1.5rem; }
        .form-rij { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; }
        @media (max-width: 500px) { .form-rij { grid-template-columns: 1fr; } }
        textarea { resize: vertical; min-height: 130px; }
    </style>
</head>
<body>

<nav>
    <span class="nav-logo">Race<span>Coach</span>Finder</span>
    <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="coaches.html">Coaches zoeken</a></li>
    </ul>
</nav>

<div class="container">
    <div class="contact-wrap">

        <div class="contact-info">
            <h2>Contact</h2>
            <p>Heb je een vraag, opmerking of wil je samenwerken? Stuur ons een bericht en we reageren zo snel mogelijk.</p>
            <div class="contact-detail">
                <div class="contact-item">
                    <span class="contact-icoon">✉️</span>
                    <div>
                        <div class="contact-item-label">E-mail</div>
                        <div class="contact-item-waarde">
                            <a href="mailto:racecoachfinder@gmail.com">racecoachfinder@gmail.com</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="contact-form-kaart">
            <h2>Stuur een bericht</h2>
            <div id="melding"></div>
            <div class="form-rij">
                <div class="formulier-groep">
                    <label for="naam">Naam *</label>
                    <input type="text" id="naam" placeholder="Jouw naam">
                </div>
                <div class="formulier-groep">
                    <label for="email">E-mailadres *</label>
                    <input type="email" id="email" placeholder="jouw@email.com">
                </div>
            </div>
            <div class="formulier-groep">
                <label for="onderwerp">Onderwerp</label>
                <input type="text" id="onderwerp" placeholder="Waar gaat je bericht over?">
            </div>
            <div class="formulier-groep">
                <label for="bericht">Bericht *</label>
                <textarea id="bericht" placeholder="Schrijf hier je bericht..."></textarea>
            </div>
            <button class="btn btn-primair" style="width:100%;margin-top:0.25rem" onclick="verstuur()">
                Verstuur bericht
            </button>
        </div>

    </div>
</div>

<footer>
    <div class="footer-inhoud">
        <div class="footer-links">
            <a href="hoe-werkt-het.html">Hoe werkt het</a>
            <a href="contact.html">Contact</a>
            <a href="disclaimer.html">Disclaimer</a>
        </div>
        <p>&copy; 2026 RaceCoachFinder</p>
    </div>
</footer>

<script src="js/auth.js"></script>
<script>
updateNav();

async function verstuur() {
    const naam = document.getElementById('naam').value.trim();
    const email = document.getElementById('email').value.trim();
    const onderwerp = document.getElementById('onderwerp').value.trim();
    const bericht = document.getElementById('bericht').value.trim();
    const meldingEl = document.getElementById('melding');

    if (!naam || !email || !bericht) {
        meldingEl.innerHTML = '<div class="melding melding-fout">Vul alle verplichte velden (*) in.</div>';
        return;
    }

    const btn = event.currentTarget;
    btn.disabled = true;
    btn.textContent = 'Versturen...';

    try {
        const res = await fetch('https://racecoachfinder-production.up.railway.app/api/contact', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ naam, email, onderwerp: onderwerp || null, bericht })
        });
        if (!res.ok) throw new Error(await res.text());

        meldingEl.innerHTML = '<div class="melding melding-succes">Bericht verstuurd! We reageren zo snel mogelijk.</div>';
        document.getElementById('naam').value = '';
        document.getElementById('email').value = '';
        document.getElementById('onderwerp').value = '';
        document.getElementById('bericht').value = '';
    } catch {
        meldingEl.innerHTML = '<div class="melding melding-fout">Versturen mislukt. Probeer het opnieuw of mail ons direct.</div>';
    } finally {
        btn.disabled = false;
        btn.textContent = 'Verstuur bericht';
    }
}
</script>
</body>
</html>
